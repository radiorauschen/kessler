name: mac package

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  mac:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: rust
        run: rustup update stable && rustup default stable

      - uses: Swatinem/rust-cache@v2

      - name: build, sign ad hoc and pack
        run: ./bundle/make-app.sh --share

      - uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: kessler-macos
          retention-days: 3
          path: |
            dist/*.dmg
            dist/*.zip

      - name: release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="$(sed -n 's/^version *= *"\(.*\)"/\1/p' Cargo.toml | head -1)"
          tag="v$version"
          if ! gh release view "$tag" >/dev/null 2>&1; then
            awk -v v="## $version" '$0==v{on=1;next} /^## /{on=0} on' CHANGELOG.md > notes.md
            gh release create "$tag" --title "kessler $version" --notes-file notes.md --target "$GITHUB_SHA" \
              || true
          fi
          gh release upload "$tag" dist/*.dmg dist/*.zip --clobber
